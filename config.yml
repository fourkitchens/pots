version: 2.1

# Executors define the environment in which the jobs will run.
executors:
  playwright-executor:
    docker:
      - image: mcr.microsoft.com/playwright:v1.61.0-noble

# To easily configure jobs here, parameters are set up below. Since we are
# typically not calling this workflow via pipelines, consider changing the
# defaults here for any permanent configuration you need to do on a project
# by project basis.
parameters:

  run-sec-updates-check:
    description: "use to trigger the Autosec process"
    type: boolean
    default: false
    # The value for this variable will be set using a External POST request
    # To trigger the Automatic security updates check.
  click-data:
    description: >
      JSON blob of ClickUp settings for the AutoSec ticket, set by the same external
      POST that triggers run-sec-updates-check. Unpacked by the automatic-update script.
      Keys: list_id, client_id, assignee_id (optional), status (optional).
      The ClickUp API token is NOT here — it is a CircleCI project env var (CU_TOKEN),
      since pipeline parameters are readable via the CircleCI API/UI. Defaults to "{}"
      (ticketing disabled).
    type: string
    default: "{}"
  run-playwright-e2e-tests:
    description: "Enables playwright E2E tests"
    type: boolean
    default: false
  playwright-vrt-target-env:
    description: "Pantheon environment to compare the deployed multidev against during VRT"
    type: string
    default: "live"
  vrt-mode:
    description: >
      Which VRT flow to run. Set by the GitHub Actions label trigger via the CircleCI
      API. "none" = normal build/deploy pipeline; "plain" = VRT only; "fresh-db" =
      refresh DB+files from live then VRT.
    type: string
    default: "none"
  playwright-path:
    description: "Path to playwright tests"
    type: string
    default: "tests/playwright"
  php-version:
    description: major.minor or major.minor.patch version number for php version to use.
    type: string
    # This value must be a valid cimg/php tag, e.g. "8.4" or "8.4.2".
    # Standard CircleCI images support both major.minor and major.minor.patch.
    default: "8.4"
  terminus-version:
    description: >
      Full Terminus version to install at runtime. Pin this for reproducible
      builds. Note the Build Tools plugin formally targets Terminus ^3, though it
      currently also works under 4.x.
    type: string
    default: "4.3.2"
  tz:
    description: The timezone definition.
    type: string
    default: "America/Chicago"
  host-variant:
    description: A string representing a site's host. EX acquia, pantheon
    type: string
    default: "pantheon"
  docroot:
    description: "Where composer installs drupal."
    default: "web"
    type: string
  artifact_workspace:
    description: "Where the build stores the built artifact temporarily."
    default: "~/project"
    type: string

# These are the directories that will be saved between builds and deploys.
# Change these if the list below needs different folders. Directory names are
# relative to the project root.
persisting_dirs: &persisting_dirs
  - << pipeline.parameters.docroot >>
  - vendor
  - drush
  - .gitignore
# - node_modules


env: &env
  #########################
  # MANDITORY CONFIGURATION
  #
  # Set these either here in your config.yml or in CircleCI project Enviornment
  # variables.
  #########################

  # A github access token so the bot user can comment back on the commit.
  #
  # GITHUB_TOKEN: 12345678790abcdef

  # ClickUp API token for the AutoSec ticket (kept out of the click-data pipeline
  # parameter because parameters are readable via the CircleCI API/UI). The rest of the
  # ClickUp settings travel in the click-data parameter.
  #
  # CU_TOKEN: pk_12345678_ABCDEF...

  # Optional: OpenAI model used for AutoSec's AI testing-step generation.
  # Defaults to gpt-4o-mini when unset.
  #
  # OPENAI_MODEL: gpt-4o-mini

  ############################
  # ACQUIA SPECIFIC SETTINGS
  ############################

  # Acquia git repo url.
  #
  # ACQUIA_REPO: sitename@svn-21939.prod.hosting.acquia.com:sitename.git

  # Cloud API Realm. Usually "prod" or "devcloud".
  #
  # See: https://docs.acquia.com/acquia-cloud/api#realm
  #
  # ACQUIA_REALM: prod

  ############################
  # PANTHEON SPECIFIC SETTINGS
  ############################

  # TERMINUS_TOKEN: The Pantheon machine token

  ########################
  # OPTIONAL CONFIGURATION
  ########################

  # An arbitrary email that will be used as the committer when building the
  # artifact.
  #
  # Default: bender@fourkitchens.com
  #
  # GIT_EMAIL: bender@fourkitchens.com

  # Name of the Acquia or Pantheon site to deploy to.
  #
  # Default: github repo name
  #
  # SITE_NAME: my_site

  # Environment to get canonical database and files from
  #
  # Possible Values:
  # For Acquia: dev, test prod
  # For Pantheon: dev, test, live
  #
  # Default: "prod" on Acquia. "live" on Pantheon
  #
  # CANONICAL_ENV: dev

  # Script used to sanitize databases. Only used when CANONICAL_ENV is not dev.
  #
  # Default: empty
  #
  # SANITIZE_SCRIPT: ./vendor/fourkitchens/pots/scripts/sanitize-db

  # Sync Configuration
  #
  # We can't identify the sync directory here, so we make an assumption
  # that if we have the unique (not usually config ignored) system.site.yml
  # somewhere in the ./config directory, that you likely want configuration to
  # be synced. You can manually turn it off here though.
  #
  # Possible Values YES, NO
  # Default: Yes if Any directory in the ./config directory (inclusive) contains
  #          system.site.yml. Ex: YES if ./config/system.site.yml or
  #          ./config/default/system.site.yml or ./config/sync/system.site.yml
  #          exists.
  #
  # SYNC_CONFIG: NO

  #####################################
  # OPTIONAL CONFIGURATION FOR PANTHEON
  #####################################

  # Build CI multidevs on every commit on Pantheon. This way you get the ci-*
  # environments. This may be useful for visual regression testing or workflows
  # without PRs.
  #
  # Possible Values: YES, NO
  #
  # Default: NO
  #
  # CI_BUILD: YES

  # Define the main branch releases are cut from.
  #
  # Default: "main" if the branch it exists, "master" otherwise.
  #
  # MAIN_BRANCH: master

  # Define the development branch where active development happens on github.
  # This branch is used most in gitflow development patterns.
  #
  # Default: develop
  #
  # DEVELOPMENT_BRANCH: dev

  # Re-sync content for multidevs every time a push is made to Pantheon.
  #
  # Possible Values: NO, YES
  #
  # Default: NO
  #
  # REBUILD_MULTIDEV_ENV_EVERY_PUSH: YES

  # Re-sync content for the Github
  # development multidev on Pantheon every time a push is made to
  # DEVELOPMENT_BRANCH branch.
  #
  # Possible Values: NO, YES
  #
  # Default: NO
  #
  # REBUILD_DEVELOPMENT_ENV_EVERY_PUSH: YES


  # Define the name of the multidev used for the Github development branch. Must
  # follow the multidev naming conventions for Pantheon.
  #
  # Default: github-dev
  #
  # DEVELOPMENT_ENV: circleci


  ###########################
  # STUFF THAT DOESN'T CHANGE
  ###########################
  HOST_VARIANT: << pipeline.parameters.host-variant >>
  DATE_TIMEZONE: << pipeline.parameters.tz >>
  DOCROOT: << pipeline.parameters.docroot >>
  TERM: xterm

defaults: &defaults
  executor:
    name: php/default
    tag: << pipeline.parameters.php-version >>
  working_directory: ~/project
  resource_class: small
  environment:
    <<: *env

jobs:
  # Static Testing. This will run independently of a build to fail quickly.
  static_tests:
    <<: *defaults
    steps:
      - setup-project
      - run:
          name: run static tests
          command: |
            if [ -f "./.circleci/scripts/test/static" ]; then
              ./.circleci/scripts/test/static
            else
              ./vendor/fourkitchens/pots/scripts/test/static
            fi
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results

  # Job used to create what will be committed to the Artifact.
  #
  # You will have all the dependency managers installed here in case you need
  # them.
  build:
    <<: *defaults
    resource_class: medium+
    steps:
      - setup-project
      - run:
          name: run PHP build step
          command: |
            if [ -f "./.circleci/scripts/build/php" ]; then
              ./.circleci/scripts/build/php
            else
              ./vendor/fourkitchens/pots/scripts/build/php
            fi
      - run:
          name: run theme build step
          command: |
            if [ -f "./.circleci/scripts/build/theme" ]; then
              ./.circleci/scripts/build/theme
            else
              ./vendor/fourkitchens/pots/scripts/build/theme
            fi
      - persist_to_workspace:
          root: .
          paths: *persisting_dirs

  # Job used to deploy to a remote environment.
  #
  # This could be as simple as pushing the artifact to a remote git repo or as
  # complicated as building a remote environment to push to. This job will not
  # be run if the host-variant parameter is set to "pantheon"
  deploy:
    <<: *defaults

    steps:
      - restore-project:
          workspace_root: << pipeline.parameters.artifact_workspace >>
      - run:
          name: Deploy the code
          command: |
            if [ -f "./.circleci/scripts/deploy" ]; then
              ./.circleci/scripts/deploy
            else
              ./vendor/fourkitchens/pots/scripts/deploy
            fi

  # Job used to deploy to pantheon.
  #
  # This job is special because pantheon employs a special docker container and
  # the use of terminus with build tools which expect a very specific
  # environment configuration. To enable this job, set the host-variant
  # parameter to "pantheon".
  deploy_to_pantheon:
    <<: *defaults
    docker:
      - image: cimg/php:<< pipeline.parameters.php-version >>
    environment:
      <<: *env
      TZ: /usr/share/zoneinfo/<< pipeline.parameters.tz >>
      TERM: dumb
      # BUILD_TOOLS_VERSION: ^2.0.0-alpha4
    steps:
      - restore-project:
          workspace_root: << pipeline.parameters.artifact_workspace >>
      - install-terminus
      # The Terminus Secrets plugin shells out to rsync to upload the secrets
      # file to the environment's files/ directory. cimg/php does not ship rsync
      # (the old build-tools-ci image did), so install it before deploying.
      - install-rsync
      # This says "dev" but it also handles Multidev instances too.
      - deploy-to-pantheon-env:
          environment: 'dev'

  deploy_to_pantheon_to_test:
    <<: *defaults
    docker:
      - image: cimg/php:<< pipeline.parameters.php-version >>
    environment:
      <<: *env
      TZ: /usr/share/zoneinfo/<< pipeline.parameters.tz >>
      TERM: dumb
    steps:
      - install-terminus:
          install-build-tools: false
      - deploy-to-pantheon-env:
          environment: 'test'

  deploy_to_pantheon_to_live:
    <<: *defaults
    docker:
      - image: cimg/php:<< pipeline.parameters.php-version >>
    environment:
      <<: *env
      TZ: /usr/share/zoneinfo/<< pipeline.parameters.tz >>
      TERM: dumb
    steps:
      - install-terminus:
          install-build-tools: false
      - deploy-to-pantheon-env:
          environment: 'live'


  security_updates_check:
    <<: *defaults
    docker:
      - image: cimg/php:<< pipeline.parameters.php-version >>
    environment:
      <<: *env
      TZ: /usr/share/zoneinfo/<< pipeline.parameters.tz >>
      TERM: dumb
      # ClickUp settings for the AutoSec ticket, unpacked by the automatic-update script.
      CLICK_DATA: << pipeline.parameters.click-data >>
    steps:
      - run:
          name: Upgrade composer
          command: composer self-update
      - checkout
      - php/install_composer
      - php/install_packages
      - install-terminus:
          install-build-tools: false
      - run:
          name: setup-environment-vars
          command: |
            if [ -f "./.circleci/scripts/set-environment" ]; then
              ./.circleci/scripts/set-environment
            else
              ./vendor/fourkitchens/pots/scripts/set-environment
            fi
      - add_ssh_keys
      - run: composer audit --format=json > /tmp/projects_to_update.json 2>/dev/null || true
      - run:
          name: Check security updates
          command: |
              git config --global user.email "bender@fourkitchens.com"
              git config --global user.name "CI Bot"
              echo "Starting script"
              if [ -f "./.circleci/scripts/security-updates/automatic-update" ]; then
                cat /tmp/projects_to_update.json | ./.circleci/scripts/security-updates/automatic-update
              else
                cat /tmp/projects_to_update.json | ./vendor/fourkitchens/pots/scripts/security-updates/automatic-update
              fi
              echo "Script done"

  playwright-e2e-test:
    <<: *defaults
    executor: playwright-executor
    parallelism: 4
    environment:
      <<: *env
    steps:
      - playwright-skip-when-disabled:
          flag: << pipeline.parameters.run-playwright-e2e-tests >>
      - playwright-prepare
      - run:
          name: Configure E2E base URL
          command: |
            if [ -n "$BASIC_USER" ] && [ -n "$BASIC_PASS" ]; then
              echo "export REMOTE_ENV_BASE_URL=https://${BASIC_USER}:${BASIC_PASS}@${TERMINUS_ENV}-${TERMINUS_SITE}.pantheonsite.io/" >> $BASH_ENV
            else
              echo "export REMOTE_ENV_BASE_URL=https://${TERMINUS_ENV}-${TERMINUS_SITE}.pantheonsite.io/" >> $BASH_ENV
            fi
      - playwright-wake:
          http-wake: true
      - playwright-run:
          report-dir: e2e
          test-command: 'npx playwright test --grep-invert "@vrt" --shard="${PLAYWRIGHT_SHARD}/${PLAYWRIGHT_TOTAL_SHARDS}"'

  playwright-e2e-merge-results:
    executor: playwright-executor
    working_directory: ~/project
    environment:
      <<: *env
    steps:
      - playwright-skip-when-disabled:
          flag: << pipeline.parameters.run-playwright-e2e-tests >>
      - playwright-merge:
          report-dir: e2e

  # Refreshes a PR multidev with DB + files from the canonical (live) env and
  # runs the deploy commands, so VRT can run against branch code on live content.
  # Used by the vrt-on-label-fresh-db workflow.
  vrt_sync_from_live:
    <<: *defaults
    docker:
      - image: cimg/php:<< pipeline.parameters.php-version >>
    environment:
      <<: *env
      TZ: /usr/share/zoneinfo/<< pipeline.parameters.tz >>
      TERM: dumb
    steps:
      - restore-project:
          workspace_root: << pipeline.parameters.artifact_workspace >>
      - install-terminus
      - install-rsync
      - run:
          name: setup-environment-vars
          command: |
            if [ -f "./.circleci/scripts/set-environment" ]; then
              ./.circleci/scripts/set-environment
            else
              ./vendor/fourkitchens/pots/scripts/set-environment
            fi
      - run:
          name: Sync DB + files from live and run deploy commands
          no_output_timeout: 30m
          command: |
            if [ -f "./.circleci/scripts/sync-from-live" ]; then
              ./.circleci/scripts/sync-from-live
            else
              ./vendor/fourkitchens/pots/scripts/pantheon/sync-from-live
            fi

  playwright-vrt-test:
    <<: *defaults
    executor: playwright-executor
    parallelism: 4
    environment:
      <<: *env
    steps:
      - playwright-prepare
      - playwright-wake
      - run:
          name: Configure VRT source and target environments
          command: |
            echo "export VRT_PANTHEON_SITE=${TERMINUS_SITE}" >> $BASH_ENV
            echo "export VRT_SOURCE_ENV=${TERMINUS_ENV}" >> $BASH_ENV
            echo "export VRT_TARGET_ENV=<< pipeline.parameters.playwright-vrt-target-env >>" >> $BASH_ENV
      - playwright-run:
          report-dir: vrt
          test-command: npm run vrt:ci

  playwright-vrt-merge-results:
    executor: playwright-executor
    working_directory: ~/project
    environment:
      <<: *env
    steps:
      - playwright-merge:
          report-dir: vrt
  # Run this on one of the main branches to push a release back to github.
  #
  # This usually will do things like create a change log and bump the version
  # on the source repository.
  release:
    <<: *defaults
    steps:
      - setup-project
      - run:
          name: Publish a Release
          command: |
            if [ -f "./.circleci/scripts/release" ]; then
              ./.circleci/scripts/release
            else
              ./vendor/fourkitchens/pots/scripts/release
            fi

workflows:
  version: 2

  scheduled_update_check:
    when: << pipeline.parameters.run-sec-updates-check >>
    jobs:
      - security_updates_check:
          filters:
            branches:
              only:
                - 'main'
                - 'master'

  build-deploy-pantheon:
    when:
      and:
      - equal: [ pantheon, << pipeline.parameters.host-variant >> ]
      - equal: [ false, << pipeline.parameters.run-sec-updates-check >> ]
      # Don't run the full build/deploy for VRT-only pipelines (triggered via the
      # GitHub Actions label workflow, which sets vrt-mode). Normal push/PR
      # pipelines use the default "none" and run as usual.
      - equal: [ "none", << pipeline.parameters.vrt-mode >> ]
    jobs:
      - static_tests
      - build
      # This is doesn't set the branch restraints because multidevs can be
      # created using any branch.
      - deploy_to_pantheon:
          requires:
            - static_tests
            - build
      - playwright-e2e-test:
          filters: pipeline.parameters.run-playwright-e2e-tests == true
          requires:
            - deploy_to_pantheon
      - playwright-e2e-merge-results:
          filters: pipeline.parameters.run-playwright-e2e-tests == true
          requires:
            - playwright-e2e-test:
              - success
              - failed
              - canceled
      - approve_deploy_to_test:
          type: approval
          requires:
            - deploy_to_pantheon
          filters:
            branches:
              only:
                - 'main'
                - 'master'
      - deploy_to_pantheon_to_test:
          requires:
            - approve_deploy_to_test
          filters:
            branches:
              only:
                - 'main'
                - 'master'
      - approve_deploy_to_live:
          type: approval
          requires:
            - deploy_to_pantheon_to_test
          filters:
            branches:
              only:
                - 'main'
                - 'master'
      - deploy_to_pantheon_to_live:
          requires:
            - approve_deploy_to_live
          filters:
            branches:
              only:
                - 'main'
                - 'master'

      - release:
          requires:
          - deploy_to_pantheon
          filters:
            branches:
              only:
                - 'main'
                - 'master'

  # Runs the Playwright VRT suite on demand. Triggered by the GitHub Actions
  # workflow (templates/github-workflows/vrt-label-trigger.yml): labeling a PR
  # "run vrt tests" makes it call the CircleCI API with vrt-mode=plain. It tests
  # the PR's already-deployed multidev (created by build-deploy-pantheon on push);
  # it does not redeploy. The `build` job only provides the workspace/deps the VRT
  # jobs expect.
  vrt-on-label:
    when:
      and:
        - equal: [ pantheon, << pipeline.parameters.host-variant >> ]
        - equal: [ "plain", << pipeline.parameters.vrt-mode >> ]
    jobs:
      - build
      - playwright-vrt-test:
          requires:
            - build
      - playwright-vrt-merge-results:
          requires:
            - playwright-vrt-test:
              - success
              - failed
              - canceled

  # Same as vrt-on-label, but first refreshes the multidev's DB + files from live
  # and runs the deploy commands (see vrt_sync_from_live). Triggered by labeling a
  # PR "run vrt tests with fresh db", which the GitHub Actions workflow maps to
  # vrt-mode=fresh-db.
  vrt-on-label-fresh-db:
    when:
      and:
        - equal: [ pantheon, << pipeline.parameters.host-variant >> ]
        - equal: [ "fresh-db", << pipeline.parameters.vrt-mode >> ]
    jobs:
      - build
      - vrt_sync_from_live:
          requires:
            - build
      - playwright-vrt-test:
          requires:
            - vrt_sync_from_live
      - playwright-vrt-merge-results:
          requires:
            - playwright-vrt-test:
              - success
              - failed
              - canceled

  build-deploy-acquia:
    when:
      not:
        equal: [ pantheon, << pipeline.parameters.host-variant >> ]
    jobs:
      - static_tests
      - build
      - deploy:
          requires:
            - static_tests
            - build
          filters:
            branches:
              only:
                - main
                - master
                - develop
                - /release-.*/
      - release:
          requires:
          - deploy
          filters:
            branches:
              only:
                - 'main'
                - 'master'

###### Please do not change things in the commands without contributing back.
node-install-parameters: &node-install-parameters
  install-yarn:
      default: false
      description: Install Yarn?
      type: boolean
  node-version:
      default: ""
      description: |
          Specify the full version tag to install. To install the latest version, set the version to `latest`. If unspecified, the version listed in .nvmrc will be installed. If no .nvmrc file exists the active LTS version of Node.js will be installed by default. For a full list of releases, see the following: https://nodejs.org/en/download/releases
      type: string
  yarn-version:
      default: ""
      description: |
          Pick a version of Yarn to install (if no version is specified, the latest stable version will be installed): https://github.com/yarnpkg/yarn/releases
      type: string
node-install-packages-parameters: &node-install-packages-parameters
  node-app-dir:
    default: .
    description: >-
      Path to the directory containing your package.json file. Not needed if
      package.json lives in the root.
    type: string
  node-cache-only-lockfile:
    default: true
    description: >
      If true, package.json will be ignored in the cache key. Useful for
      projects where package.json changes do not always invalidate dependencies.

      Note: package.json will still be the final fallback key incase a project
      is not configured with a lock file.
    type: boolean
  node-cache-path:
    default: ''
    description: >
      By default, this orb will utilize 'npm ci' and cache the '~/.npm'
      directory. Override which path to cache with this parameter.
    type: string
  node-cache-version:
    default: v1
    description: >-
      Change the default cache version if you need to clear the cache for any
      reason.
    type: string
  node-check-cache:
    default: never
    description: |
      Yarn berry only for Zero install support -
      Use 'always' to always --check-cache argument to yarn install.
      Use 'detect' to enable caching of yarn.lock and to only add when required.
    enum:
      - never
      - always
      - detect
    type: enum
  node-include-branch-in-cache-key:
    default: true
    description: |
      If true, this cache bucket will only apply to jobs within the same branch.
    type: boolean
  node-override-ci-command:
    default: ''
    description: >
      By default, packages will be installed with "npm ci", "yarn install
      --frozen-lockfile" or "yarn install --immutable".

      Optionally supply a custom package installation command, with any
      additional flags needed.
    type: string
  node-pkg-manager:
    default: npm
    description: Select the default node package manager to use. NPM v5+ Required.
    enum:
      - npm
      - yarn
      - yarn-berry
    type: enum
  node-with-cache:
    default: true
    description: Cache your node packages automatically for faster install times.
    type: boolean
orbs:
  node: circleci/node@7.2.1
  php: circleci/php@3.0.0
commands:
  install-terminus:
    description: >
      Install Pantheon Terminus at runtime, and optionally the Build Tools and
      Secrets plugins. Replaces the deprecated quay.io/pantheon-public/build-tools-ci
      image, which used to ship these pre-installed.
    parameters:
      install-build-tools:
        description: >
          Install the Terminus Build Tools and Secrets plugins. Only the
          dev/multidev deploy uses build:* and secrets:* commands; leave this
          false for jobs that only need core Terminus (env:deploy, env:wake,
          backup:create, etc.) to save time.
        type: boolean
        default: true
    steps:
      - restore_cache:
          keys:
            - terminus-<< pipeline.parameters.terminus-version >>-{{ .Branch }}
            - terminus-<< pipeline.parameters.terminus-version >>-
      - run:
          name: Install Terminus
          command: |
            if [ ! -f ~/terminus/terminus ]; then
              mkdir -p ~/terminus
              cd ~/terminus
              curl -L "https://github.com/pantheon-systems/terminus/releases/download/<< pipeline.parameters.terminus-version >>/terminus.phar" -o terminus
              chmod +x terminus
            fi
            # Use sudo only when not already root. cimg/php runs as the non-root
            # "circleci" user (with passwordless sudo), while the Playwright image
            # runs as root and does not ship sudo.
            SUDO=""
            if [ "$(id -u)" -ne 0 ]; then
              SUDO="sudo"
            fi
            $SUDO ln -sf ~/terminus/terminus /usr/local/bin/terminus
            terminus --version
      - when:
          condition: << parameters.install-build-tools >>
          steps:
            - run:
                name: Install Terminus Build Tools plugin
                command: |
                  terminus self:plugin:install --yes pantheon-systems/terminus-build-tools-plugin
            - run:
                name: Install Terminus Secrets plugin
                command: |
                  terminus self:plugin:install --yes pantheon-systems/terminus-secrets-plugin
      - save_cache:
          key: terminus-<< pipeline.parameters.terminus-version >>-{{ .Branch }}
          paths:
            - ~/terminus
            - ~/.terminus
  install-project-dependency-managers:
    description: setup composer and npm.
    parameters:
      <<: *node-install-parameters
    steps:
      # Most projects require both composer and npm to be installed to do
      # anything.
      - php/install_composer
      - run:
          name: Set up Github Token
          command: |
            # Configure the GitHub Oauth token if it is available
            if hash composer 2>/dev/null && [[ -n "$GITHUB_TOKEN" ]]; then
              composer -n config --global github-oauth.github.com $GITHUB_TOKEN
            fi
      - restore_cache:
          keys:
            - nvm-v2-{{ checksum ".nvmrc" }}
            - nvm-v2-
      - run:
          name: Relink NVM if it was cached.
          command: |
            # If NVM was cached, we need to hook it up via .bashrc. This will
            # allow the node orb to detect nvm being installed and not make
            # the nvm install script try to upgrade the existing nvm version.
            NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              echo 'NVM already exists.'
              echo 'export NVM_DIR="$HOME/.nvm"' >> "$BASH_ENV";
              echo '[ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh" --no-use' >> "$BASH_ENV";
            fi
      - node/install:
          install-yarn: << parameters.install-yarn >>
          node-version: << parameters.node-version >>
          yarn-version: << parameters.yarn-version >>
      - save_cache:
          key: nvm-v2-{{ checksum ".nvmrc" }}
          paths:
            - ~/.nvm
      - run: node --version
  install-project-dependencies:
    description: install both npm and composer dependencies
    parameters:
      <<: *node-install-packages-parameters
    steps:
      - php/install_packages
      - node/install-packages:
          app-dir: << parameters.node-app-dir >>
          cache-only-lockfile: << parameters.node-cache-only-lockfile >>
          cache-path: << parameters.node-cache-path >>
          cache-version: << parameters.node-cache-version >>
          check-cache: << parameters.node-check-cache >>
          include-branch-in-cache-key: << parameters.node-include-branch-in-cache-key >>
          override-ci-command: << parameters.node-override-ci-command >>
          pkg-manager: << parameters.node-pkg-manager >>
          with-cache: << parameters.node-with-cache >>
  install-rsync:
    description: install rsync
    steps:
      - run:
          name: Install rsync
          command: |
            if ! command -v rsync &> /dev/null
            then
              sudo apt-get update -y
              sudo apt-get -y install rsync
            fi
  setup-project:
    description: setup php and node and download all dependencies for the project.
    parameters:
      <<: *node-install-packages-parameters
      <<: *node-install-parameters
    steps:
      - checkout
      - install-rsync
      - install-project-dependency-managers:
          install-yarn: << parameters.install-yarn >>
          node-version: << parameters.node-version >>
          yarn-version: << parameters.yarn-version >>
      - install-project-dependencies:
          node-app-dir: << parameters.node-app-dir >>
          node-cache-only-lockfile: << parameters.node-cache-only-lockfile >>
          node-cache-path: << parameters.node-cache-path >>
          node-cache-version: << parameters.node-cache-version >>
          node-check-cache: << parameters.node-check-cache >>
          node-include-branch-in-cache-key: << parameters.node-include-branch-in-cache-key >>
          node-override-ci-command: << parameters.node-override-ci-command >>
          node-pkg-manager: << parameters.node-pkg-manager >>
          node-with-cache: << parameters.node-with-cache >>
      - run:
          name: Set up environment variables
          command: |
            if [ -f "./.circleci/scripts/set-environment" ]; then
              ./.circleci/scripts/set-environment
            elif [ -f "./vendor/fourkitchens/pots/set-environment" ]; then
              ./vendor/fourkitchens/pots/set-environment
            fi
  restore-project:
    description: Restore a Drupal project that was persisted from another job.
    parameters:
      workspace_root:
        description: "Where to copy the workspace to"
        default: "/tmp/build"
        type: string
    steps:
      - checkout
      - attach_workspace:
          at: << parameters.workspace_root >>
  deploy-to-pantheon-env:
    description: Do the work to deploy to a pantheon environment.
    parameters:
      environment:
        description: "The environment: dev, test, live. Dev will make accommodations for Multidev workflow"
        default: "dev"
        type: string
    steps:
      - restore-project:
          workspace_root: << pipeline.parameters.artifact_workspace >>
      - run:
          name: Prep Terminus Token for Cache Key
          command: echo "$TERMINUS_TOKEN" > terminus-cache-key.txt
      - restore_cache:
          keys:
            - terminus-cache-v1-{{ checksum "terminus-cache-key.txt" }}
            - terminus-cache-v1-
      - run:
          name: setup-environment-vars
          command: |
            if [ -f "./.circleci/scripts/set-environment" ]; then
              ./.circleci/scripts/set-environment
            else
              ./vendor/fourkitchens/pots/scripts/set-environment
            fi
      - when:
          condition:
            and:
              - equal: [ dev, << parameters.environment >> ]
          steps:
            - run:
                name: deploy to Pantheon
                command: |
                  if [ -f "./.circleci/scripts/deploy" ]; then
                    ./.circleci/scripts/deploy
                  else
                    ./vendor/fourkitchens/pots/scripts/pantheon/deploy
                  fi
                no_output_timeout: 30m
      - when:
          condition:
            and:
              - not:
                  equal: [ dev, << parameters.environment >> ]
          steps:
            - run:
                name: deploy to Pantheon
                command: |
                  if [ -f "./.circleci/scripts/deploy-to-<< parameters.environment >>" ]; then
                    ./.circleci/scripts/deploy-to-<< parameters.environment >>
                  else
                    ./vendor/fourkitchens/pots/scripts/pantheon/deploy-to-<< parameters.environment >>
                  fi
                no_output_timeout: 30m
      - save_cache:
          key: terminus-cache-v1-{{ checksum "terminus-cache-key.txt" }}
          paths:
            - ~/.terminus
  playwright-skip-when-disabled:
    description: >
      Halt the current job early when the given feature flag is not "true".
      Pass the relevant pipeline parameter as `flag`.
    parameters:
      flag:
        description: "Value of the pipeline parameter that gates this suite."
        type: boolean
    steps:
      - run:
          name: Skip Playwright when disabled
          command: |
            if [ "<< parameters.flag >>" != "true" ]; then
              echo "Playwright suite disabled; halting."
              circleci step halt
            fi
  playwright-prepare:
    description: >
      Restore the built project, set environment variables, install Terminus, and
      install Playwright npm dependencies and browsers (all cached). Shared setup
      for the Playwright test jobs.
    steps:
      - restore-project:
          workspace_root: << pipeline.parameters.artifact_workspace >>
      - restore_cache:
          keys:
            - composer-cache-{{ checksum "composer.lock" }}
            - composer-cache-
      - run:
          name: setup-environment-vars
          command: |
            if [ -f "./.circleci/scripts/set-environment" ]; then
              ./.circleci/scripts/set-environment
            else
              ./vendor/fourkitchens/pots/scripts/set-environment
            fi
      - run:
          name: Install PHP (required by Terminus)
          command: |
            # The Playwright image ships Node but not PHP, and Terminus is a PHP
            # phar. Install a PHP CLI runtime (with the extensions Terminus needs)
            # so terminus commands work here, e.g. `terminus drush ... -- uli`.
            if ! command -v php >/dev/null 2>&1; then
              SUDO=""
              if [ "$(id -u)" -ne 0 ]; then SUDO="sudo"; fi
              $SUDO apt-get update -y
              $SUDO apt-get install -y --no-install-recommends php-cli php-curl php-mbstring php-xml
            fi
            php --version
      - install-terminus:
          install-build-tools: false
      - restore_cache:
          keys:
            - playwright-npm-v1-{{ checksum "<< pipeline.parameters.playwright-path >>/package-lock.json" }}
            - playwright-npm-v1-
      - restore_cache:
          keys:
            - playwright-browsers-v1-{{ checksum "<< pipeline.parameters.playwright-path >>/package-lock.json" }}
            - playwright-browsers-v1-
      - run:
          name: Install npm dependencies
          command: cd << pipeline.parameters.playwright-path >> && npm ci --prefer-offline
      - save_cache:
          key: playwright-npm-v1-{{ checksum "<< pipeline.parameters.playwright-path >>/package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Install Playwright browsers
          command: cd << pipeline.parameters.playwright-path >> && npx playwright install --with-deps
      - save_cache:
          key: playwright-browsers-v1-{{ checksum "<< pipeline.parameters.playwright-path >>/package-lock.json" }}
          paths:
            - ~/.cache/ms-playwright
  playwright-wake:
    description: >
      Authenticate Terminus and wake the target Pantheon environment. Optionally
      also warm it with an HTTP request to REMOTE_ENV_BASE_URL.
    parameters:
      http-wake:
        description: "Additionally warm the environment over HTTP (requires REMOTE_ENV_BASE_URL)."
        type: boolean
        default: false
    steps:
      - run:
          name: Wake Pantheon environment via Terminus
          command: |
            terminus -n auth:login --machine-token="$TERMINUS_TOKEN"
            terminus -n env:wake $TERMINUS_SITE.$TERMINUS_ENV
      - when:
          condition: << parameters.http-wake >>
          steps:
            - run:
                name: Wake Pantheon environment via HTTP
                command: |
                  curl -fsS --retry 5 --retry-delay 5 "$REMOTE_ENV_BASE_URL" > /dev/null
  playwright-run:
    description: >
      Run a sharded Playwright suite, capture its blob reports into
      ci-blob-reports/<report-dir>, persist them for the merge job, and fail the
      shard if the suite failed.
    parameters:
      report-dir:
        description: "Subdirectory under ci-blob-reports for this suite's reports (e.g. e2e, vrt)."
        type: string
      test-command:
        description: "Command that runs the suite, executed from the Playwright path."
        type: string
    steps:
      - run:
          name: Configure Playwright shards
          command: |
            echo "export PLAYWRIGHT_SHARD=$((${CIRCLE_NODE_INDEX}+1))" >> $BASH_ENV
            echo "export PLAYWRIGHT_TOTAL_SHARDS=${CIRCLE_NODE_TOTAL}" >> $BASH_ENV
      - run:
          name: Running Playwright << parameters.report-dir >> tests
          command: |
            cd << pipeline.parameters.playwright-path >>
            rm -rf blob-report ci-blob-reports/<< parameters.report-dir >>
            mkdir -p ci-blob-reports/<< parameters.report-dir >>
            set +e
            << parameters.test-command >>
            test_exit_code=$?
            set -e
            if [ -d blob-report ]; then
              find blob-report -maxdepth 1 -type f -name '*.zip' -exec cp {} ci-blob-reports/<< parameters.report-dir >>/ \;
            fi
            echo "${test_exit_code}" > "ci-blob-reports/<< parameters.report-dir >>/status-${CIRCLE_NODE_INDEX}.txt"
      - persist_to_workspace:
          root: .
          paths:
            - << pipeline.parameters.playwright-path >>/ci-blob-reports/<< parameters.report-dir >>
      - store_artifacts:
          path: ./<< pipeline.parameters.playwright-path >>/ci-blob-reports/<< parameters.report-dir >>
          destination: playwright-<< parameters.report-dir >>-blob-report
      - store_artifacts:
          path: /tmp/artifacts
      - run:
          name: Fail << parameters.report-dir >> shard when tests failed
          command: |
            cd << pipeline.parameters.playwright-path >>
            exit "$(cat "ci-blob-reports/<< parameters.report-dir >>/status-${CIRCLE_NODE_INDEX}.txt")"
  playwright-merge:
    description: >
      Merge the sharded Playwright blob reports for a suite into a combined HTML +
      JUnit report and store them as artifacts / test results.
    parameters:
      report-dir:
        description: "Subdirectory under ci-blob-reports holding the sharded reports (e.g. e2e, vrt)."
        type: string
    steps:
      - restore-project:
          workspace_root: << pipeline.parameters.artifact_workspace >>
      - restore_cache:
          keys:
            - playwright-npm-v1-{{ checksum "<< pipeline.parameters.playwright-path >>/package-lock.json" }}
            - playwright-npm-v1-
      - run:
          name: Install npm dependencies
          command: cd << pipeline.parameters.playwright-path >> && npm ci --prefer-offline
      - run:
          name: Merge << parameters.report-dir >> Playwright shard reports
          command: |
            cd << pipeline.parameters.playwright-path >>
            if ! find ci-blob-reports/<< parameters.report-dir >> -maxdepth 1 -type f -name '*.zip' | grep -q .; then
              echo "No << parameters.report-dir >> Playwright blob reports found to merge."
              exit 1
            fi
            rm -rf playwright-report playwright-junit
            mkdir -p playwright-junit/<< parameters.report-dir >>
            PLAYWRIGHT_JUNIT_OUTPUT_FILE=playwright-junit/<< parameters.report-dir >>/results.xml \
              npx playwright merge-reports --reporter html,junit ./ci-blob-reports/<< parameters.report-dir >>
      - store_test_results:
          path: ./<< pipeline.parameters.playwright-path >>/playwright-junit/<< parameters.report-dir >>
      - store_artifacts:
          path: ./<< pipeline.parameters.playwright-path >>/playwright-report
          destination: playwright-<< parameters.report-dir >>-report
      - store_artifacts:
          path: ./<< pipeline.parameters.playwright-path >>/playwright-junit/<< parameters.report-dir >>
          destination: playwright-<< parameters.report-dir >>-junit

##### Feel free to alter the tasks below to point to your own tasks.
